# Redraws the images every day from the contribution graph, and commits them only when something changed.
name: Refresh

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.mjs, lib/**, data/glyphs.json, icons/**, fonts/**]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add assets data
          if git diff --cached --quiet; then echo 'Nothing changed.'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Redraw the year'
          git push
